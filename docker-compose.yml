name: jtrader

# Shared PHP runtime tuning (serversideup reads these env vars).
x-php-env: &php-env
  PHP_OPCACHE_ENABLE: "1"
  PHP_MEMORY_LIMIT: "512M"
  PHP_MAX_EXECUTION_TIME: "120"
  PHP_POST_MAX_SIZE: "32M"
  PHP_UPLOAD_MAX_FILE_SIZE: "32M"
  AUTORUN_ENABLED: "false"

services:
  # ---- PHP-FPM application (Laravel 12 + Filament 4) ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *php-env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- Nginx web server ----
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - jtrader

  # ---- MariaDB (stores synced candles + Filament/auth tables) ----
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-jtrader}
      MARIADB_USER: ${DB_USERNAME:-jtrader}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - jtrader

  # ---- Redis (cache + queue backend for candle sync) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - jtrader

  # ---- Queue worker (background candle synchronisation jobs) ----
  queue:
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --tries=3 --timeout=120 --sleep=2
    environment:
      <<: *php-env
    # Not an HTTP service — disable the image's php-fpm healthcheck.
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- BingX WebSocket listener (real-time candle streaming) ----
  ws:
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan candles:ws
    environment:
      <<: *php-env
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- Vite dev server (front-end assets, HMR). Start with: --profile dev ----
  node:
    image: node:24-bookworm-slim
    profiles: ["dev"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    networks:
      - jtrader

volumes:
  db-data:
  redis-data:

networks:
  jtrader:
    driver: bridge
