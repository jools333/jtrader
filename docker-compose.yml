name: jtrader

# CPU budget
# -------------
# This VPS has only 2 vCPU and also runs the VPN/proxy stack (Xray VLESS Reality,
# Shadowsocks, AmneziaWG, SSTP). Proxy encryption is CPU-bound, so when the
# background workers are allowed to spin freely they starve the tunnel and the
# VPN throughput collapses.
#
# The long-running workers below are therefore capped so the tunnel always keeps
# headroom. Chart rendering is dispatched on the `charts` queue, which the queue
# worker processes *after* the `default` queue — so trading-critical jobs keep
# priority and only chart rendering slows down.
#
# `app`, `web`, `db` and `redis` are intentionally left uncapped: they are
# bursty/idle most of the time but need full CPU for migrations and imports.

# Shared PHP runtime tuning (serversideup reads these env vars).
x-php-env: &php-env
  PHP_OPCACHE_ENABLE: "1"
  PHP_MEMORY_LIMIT: "512M"
  PHP_MAX_EXECUTION_TIME: "120"
  PHP_POST_MAX_SIZE: "32M"
  PHP_UPLOAD_MAX_FILE_SIZE: "32M"
  AUTORUN_ENABLED: "false"

services:
  # ---- PHP-FPM application (Laravel 12 + Filament 4) ----
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      <<: *php-env
    volumes:
      - ./:/var/www/html
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- Nginx web server ----
  web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8070}:80"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy
    networks:
      - jtrader

  # ---- MariaDB (stores synced candles + Filament/auth tables) ----
  db:
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE:-jtrader}
      MARIADB_USER: ${DB_USERNAME:-jtrader}
      MARIADB_PASSWORD: ${DB_PASSWORD:-secret}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root}
    ports:
      - "127.0.0.1:${DB_PORT:-3306}:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - jtrader

  # ---- Redis (cache + queue backend for candle sync) ----
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    networks:
      - jtrader

  # ---- Queue worker (background candle synchronisation & chart generation) ----
  queue:
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan queue:work --queue=default,charts --tries=3 --timeout=120 --sleep=2
    deploy:
      resources:
        limits:
          # Was "1.0" — this worker is CPU-bound (chart rendering) and was
          # permanently consuming a full core of a 2-core host shared with the VPN.
          cpus: "0.30"
    environment:
      <<: *php-env
    # Not an HTTP service — disable the image's php-fpm healthcheck.
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- BingX WebSocket listener (real-time candle streaming) ----
  ws:
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan candles:ws
    deploy:
      resources:
        limits:
          # Burst-tolerant: keep enough headroom for the socket loop,
          # but never let it compete with the VPN for a whole core.
          cpus: "0.30"
    environment:
      <<: *php-env
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- Laravel scheduler (runs schedule:work for agent:scan every 30s) ----
  scheduler:
    image: jtrader/app
    restart: unless-stopped
    working_dir: /var/www/html
    command: php artisan schedule:work
    deploy:
      resources:
        limits:
          # Bursty (agent:scan every 30s, positions:sync every 60s) but
          # latency-insensitive; cap keeps the VPN responsive.
          cpus: "0.20"
    environment:
      <<: *php-env
    healthcheck:
      disable: true
    volumes:
      - ./:/var/www/html
    depends_on:
      app:
        condition: service_started
      db:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - jtrader

  # ---- Vite dev server (front-end assets, HMR). Start with: --profile dev ----
  node:
    image: node:24-bookworm-slim
    profiles: ["dev"]
    working_dir: /var/www/html
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    ports:
      - "${VITE_PORT:-5173}:5173"
    volumes:
      - ./:/var/www/html
    networks:
      - jtrader

volumes:
  db-data:
  redis-data:

networks:
  jtrader:
    driver: bridge
