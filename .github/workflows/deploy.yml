name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to jools.com.ru
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: jools.com.ru
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 25m
          envs: WEB_SHELL
          # Явно заставляем выполнять скрипт через bash
          script: |
            bash -c "/home/jools/scripts/deploy.sh main"
