name: Deploy to Production

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy to jools.com.ru
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: jools.com.ru
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: 22
          # Отключаем POSIX exit code checker от appleboy (чтобы он не слал POSIX $? в fish)
          script_stop: false
          command_timeout: 25m
          script: |
            exec bash -l -c "/home/jools/scripts/deploy.sh main"
